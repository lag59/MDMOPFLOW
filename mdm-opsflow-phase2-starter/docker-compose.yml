services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine3.22}
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: OpsFlow2026Secure
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      SECRET_KEY: change-me
      DATABASE_URL: postgresql+psycopg://postgres:OpsFlow2026Secure@db:5432/opsflow
      ALLOWED_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: 8080
    ports: ["8080:8080"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on: [backend]
