name: Backend CI

permissions:
  contents: read

on:
  push:
    paths:
      - backend/**
      - frontend/**
      - streamlit_app.py
      - docs/openapi-operationid-snapshot.md
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - streamlit_app.py
      - docs/openapi-operationid-snapshot.md
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend TypeScript check
        working-directory: frontend
        run: npm run typecheck

  backend-migrations-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run fast contract and syntax checks
        run: |
          set -o pipefail
          python backend/scripts/run_fast_guardrails.py 2>&1 | tee backend-fast-guardrails.log

      - name: Upload fast guardrail output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-fast-guardrails-output
          path: backend-fast-guardrails.log
          if-no-files-found: warn

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg

          dsn = os.environ["DATABASE_URL"].replace("+psycopg", "")
          for _ in range(30):
              try:
                  with psycopg.connect(dsn):
                      print("PostgreSQL is ready")
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("PostgreSQL was not ready in time")
          PY

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest -q -m "not guardrail"

      - name: Run production deploy canary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python backend/scripts/run_production_deploy_canary_with_audit.py

      - name: Upload production deploy canary audit log
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-canary-log
          path: backend/artifacts/production-deploy-canary.jsonl
          if-no-files-found: warn
